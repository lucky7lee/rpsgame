<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 둥근 앱 아이콘 배경 -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#93c5fd" stroke-width="8" />
  <ellipse cx="256" cy="95" rx="190" ry="55" fill="#ffffff" opacity="0.16" />

  <!-- 반짝이 별 장식 -->
  <g fill="#fef08a">
    <path d="M88 92 L95 108 L112 115 L95 122 L88 138 L81 122 L64 115 L81 108 Z" />
    <path d="M428 86 L433 98 L446 103 L433 108 L428 120 L423 108 L410 103 L423 98 Z" />
    <circle cx="72" cy="240" r="7" opacity="0.8" />
    <circle cx="442" cy="235" r="8" opacity="0.8" />
  </g>

  <!-- 상단 귀여운 황금 왕관 / 번개 엠블럼 -->
  <g filter="url(#softShadow)">
    <path d="M186 118 L212 72 L256 104 L300 72 L326 118 Z" fill="url(#crownGrad)" stroke="#78350f" stroke-width="6" stroke-linejoin="round" />
    <circle cx="212" cy="66" r="9" fill="#fef08a" stroke="#78350f" stroke-width="4" />
    <circle cx="256" cy="58" r="11" fill="#ef4444" stroke="#78350f" stroke-width="4" />
    <circle cx="300" cy="66" r="9" fill="#fef08a" stroke="#78350f" stroke-width="4" />
  </g>

  <!-- 왼쪽: 귀여운 가위(✌️) 캐릭터 -->
  <g transform="translate(52, 175) rotate(-10)" filter="url(#softShadow)">
    <g stroke="#431407" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 92 L40 20 C36 4, 62 0, 68 18 L82 82" fill="#fed7aa" />
      <path d="M82 82 L100 16 C106 0, 130 6, 124 24 L102 92" fill="#fed7aa" />
      <rect x="26" y="76" width="110" height="96" rx="46" fill="#fdba74" />
    </g>
    <!-- 귀여운 눈과 볼터치 -->
    <circle cx="64" cy="118" r="8" fill="#1e293b" />
    <circle cx="62" cy="115" r="3" fill="#ffffff" />
    <circle cx="100" cy="118" r="8" fill="#1e293b" />
    <circle cx="98" cy="115" r="3" fill="#ffffff" />
    <ellipse cx="50" cy="128" rx="9" ry="5" fill="#fb7185" opacity="0.75" />
    <ellipse cx="114" cy="128" rx="9" ry="5" fill="#fb7185" opacity="0.75" />
    <path d="M74 128 Q82 138 90 128" fill="none" stroke="#431407" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- 오른쪽: 귀여운 바위(✊) 캐릭터 -->
  <g transform="translate(292, 195) rotate(10)" filter="url(#softShadow)">
    <g stroke="#431407" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="54" width="122" height="106" rx="48" fill="#fde047" />
      <rect x="26" y="34" width="28" height="44" rx="14" fill="#fef08a" />
      <rect x="54" y="28" width="28" height="48" rx="14" fill="#fef08a" />
      <rect x="82" y="30" width="28" height="46" rx="14" fill="#fef08a" />
      <rect x="108" y="38" width="26" height="42" rx="13" fill="#fef08a" />
    </g>
    <!-- 귀여운 눈과 볼터치 -->
    <circle cx="62" cy="108" r="8" fill="#1e293b" />
    <circle cx="60" cy="105" r="3" fill="#ffffff" />
    <circle cx="102" cy="108" r="8" fill="#1e293b" />
    <circle cx="100" cy="105" r="3" fill="#ffffff" />
    <ellipse cx="46" cy="118" rx="9" ry="5" fill="#fb7185" opacity="0.75" />
    <ellipse cx="116" cy="118" rx="9" ry="5" fill="#fb7185" opacity="0.75" />
    <path d="M73 118 Q82 128 91 118" fill="none" stroke="#431407" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- 중앙 전면: 귀여운 보(🖐️) 캐릭터 -->
  <g transform="translate(166, 195)" filter="url(#softShadow)">
    <g stroke="#431407" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="
        M30 135
        L12 98 C4 84, 22 72, 32 84 L48 108
        L46 42 C46 24, 68 24, 68 42 L70 96
        L76 28 C76 10, 98 10, 98 28 L96 96
        L104 38 C106 20, 128 24, 124 42 L118 102
        L130 58 C134 44, 152 50, 148 66 L134 132
        C140 172, 118 204, 82 204
        C46 204, 26 172, 30 135 Z" fill="#f9a8d4" />
    </g>
    <!-- 초롱초롱한 눈 & 볼터치 & 미소 -->
    <circle cx="62" cy="140" r="10" fill="#1e293b" />
    <circle cx="59" cy="136" r="4" fill="#ffffff" />
    <circle cx="106" cy="140" r="10" fill="#1e293b" />
    <circle cx="103" cy="136" r="4" fill="#ffffff" />
    <ellipse cx="44" cy="154" rx="11" ry="6" fill="#f43f5e" opacity="0.65" />
    <ellipse cx="124" cy="154" rx="11" ry="6" fill="#f43f5e" opacity="0.65" />
    <path d="M72 152 Q84 168 96 152" fill="#ef4444" stroke="#431407" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- 하단 배지: RPS -->
  <g filter="url(#softShadow)">
    <rect x="136" y="412" width="240" height="54" rx="27" fill="#ffffff" stroke="#1e3a8a" stroke-width="6" />
    <text x="256" y="449" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#1d4ed8">BATTLE RPS</text>
  </g>
</svg>
